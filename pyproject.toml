[project]
name = "hotel-handoff-lab"
version = "0.1.0"
description = "Local hotel handoff prototype with source evidence"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "pydantic>=2",
    "pypdf>=6.18.1",
    "boto3[crt]>=1.43.93",
    "werkzeug>=3.1.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "edge-tts>=7.2.8",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
