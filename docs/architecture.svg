<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526f64"/></marker></defs><rect width="1200" height="880" fill="#f4f6ef"/><g font-family="Arial,sans-serif" fill="#193b32"><text x="60" y="62" font-size="30" font-weight="bold">Hotel Handoff Lab</text><text x="60" y="97" font-size="18">Source-backed intake. Human-confirmed work. Independent document evidence.</text><rect x="60" y="140" width="320" height="105" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="80" y="172" font-size="20" font-weight="bold">Synthetic guest message</text><text x="80" y="201" font-size="16">English / German / Italian</text><rect x="440" y="140" width="700" height="155" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="460" y="172" font-size="20" font-weight="bold">Strands + regional Bedrock Nova Lite</text><text x="460" y="201" font-size="16">read_request_message → find_existing_requests</text><text x="460" y="225" font-size="16">Literal string output; bounded agent turns</text><text x="460" y="249" font-size="16">No record writes or external actions</text><path d="M380,193 L435,193" stroke="#526f64" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="440" y="340" width="700" height="115" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="460" y="372" font-size="20" font-weight="bold">Independent intake checks</text><text x="460" y="401" font-size="16">Literal source support + conservative demand check</text><text x="460" y="425" font-size="16">Tool execution required; errors return inside the agent loop</text><path d="M790,295 L790,335" stroke="#526f64" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="340" width="320" height="115" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="80" y="372" font-size="20" font-weight="bold">Staff review and confirmation</text><text x="80" y="401" font-size="16">Source quotes shown in browser</text><text x="80" y="425" font-size="16">Missing details remain empty</text><path d="M440,400 L385,400" stroke="#526f64" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="505" width="320" height="130" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="80" y="537" font-size="20" font-weight="bold">SQLite invoice queue</text><text x="80" y="566" font-size="16">Explicit creation → atomic claim</text><text x="80" y="590" font-size="16">Operator opens Lexware link</text><text x="80" y="614" font-size="16">No automatic accounting action</text><path d="M220,455 L220,500" stroke="#526f64" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="440" y="505" width="700" height="130" rx="14" fill="#ffffff" stroke="#b7c5b4"/><text x="460" y="537" font-size="20" font-weight="bold">Independent file evidence monitor</text><text x="460" y="566" font-size="16">Text PDF: unique guest + stay → prepared</text><text x="460" y="590" font-size="16">Exported Sent EML: identical PDF hash → sent</text><text x="460" y="614" font-size="16">Ambiguous or unmatched evidence stays unresolved</text><path d="M380,570 L435,570" stroke="#526f64" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="685" width="1080" height="125" rx="14" fill="#e5eddf" stroke="#b7c5b4"/><text x="80" y="717" font-size="20" font-weight="bold">Boundaries</text><text x="80" y="746" font-size="16">Synthetic prototype; literal checks are not a complete semantic guarantee.</text><text x="80" y="770" font-size="16">Sent-folder import is a trusted convention, not proof of delivery. No email is sent.</text><text x="80" y="794" font-size="16">Deployed judge host: password-protected Lambda sandbox; temporary data can reset.</text><text x="60" y="850" font-size="14">Agent-authored diagram · awaiting human review · 2026-09-14</text></g></svg>